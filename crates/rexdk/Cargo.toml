[package]
name = "rexdk"
version = "0.1.0"
edition = "2024"
description = "Typed Rust client for the Rex control API"
repository = "https://github.com/alpha-og/rexdk-rs"
readme = "README.md"
keywords = ["rex", "sdk", "api", "bindings", "terminal"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tokio-tungstenite = "0.28"
